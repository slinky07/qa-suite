name: Draft release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

concurrency:
  group: qa-suite-release
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      tag: ${{ steps.candidate.outputs.tag }}

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve the candidate
        id: candidate
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use <major>.<minor>.<patch>" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [[ "${commit}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out commit ${commit} does not match ${GITHUB_SHA}" >&2
            exit 1
          fi
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Run repository tests
        run: node --test

      - name: Build twice and verify release parity
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: >-
          node scripts/release/check.mjs
          --ref "${GITHUB_SHA}"
          --tag "${RELEASE_TAG}"
          --output release-artifacts

      - name: Retain the release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Create or verify the release tag
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create or verify the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local object_json="$1"
            local object_type
            local object_sha
            object_type="$(jq -r '.object.type' <<< "${object_json}")"
            object_sha="$(jq -r '.object.sha' <<< "${object_json}")"

            while [[ "${object_type}" == "tag" ]]; do
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<< "${object_json}")"
              object_sha="$(jq -r '.object.sha' <<< "${object_json}")"
            done

            if [[ "${object_type}" != "commit" ]]; then
              echo "Tag resolves to unsupported object type ${object_type}" >&2
              exit 1
            fi
            printf '%s\n' "${object_sha}"
          }

          if tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            tagged_commit="$(resolve_tag_commit "${tag_ref}")"
            if [[ "${tagged_commit}" != "${RELEASE_COMMIT}" ]]; then
              echo "${RELEASE_TAG} points to ${tagged_commit}, not ${RELEASE_COMMIT}" >&2
              exit 1
            fi
          else
            tag_object="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
                --raw-field tag="${RELEASE_TAG}" \
                --raw-field message="qa-suite ${RELEASE_TAG}" \
                --raw-field object="${RELEASE_COMMIT}" \
                --raw-field type="commit" \
                --jq '.sha'
            )"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field ref="refs/tags/${RELEASE_TAG}" \
              --raw-field sha="${tag_object}" >/dev/null
          fi

  attest:
    name: Attest the release assets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download the validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.commit }}
          path: release-artifacts

      - name: Attest qa-suite.skill
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-artifacts/qa-suite.skill

      - name: Attest qa-suite-source.zip
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-artifacts/qa-suite-source.zip

  draft:
    name: Create or repair the draft release
    needs:
      - attest
      - tag
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download the validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.commit }}
          path: release-artifacts

      - name: Create or safely repair the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          expected_content_type() {
            case "$1" in
              qa-suite.skill) printf '%s\n' "application/octet-stream" ;;
              qa-suite-source.zip) printf '%s\n' "application/zip" ;;
              *) return 1 ;;
            esac
          }

          validate_existing_asset() {
            local asset_json="$1"
            local name
            local path
            local expected_digest
            local expected_size
            local content_type

            name="$(jq -r '.name' <<< "${asset_json}")"
            path="release-artifacts/${name}"
            if [[ ! -f "${path}" ]]; then
              echo "Unexpected remote asset ${name}" >&2
              exit 1
            fi
            expected_digest="sha256:$(sha256sum "${path}" | cut -d ' ' -f 1)"
            expected_size="$(stat -c '%s' "${path}")"
            content_type="$(expected_content_type "${name}")"

            jq -e \
              --arg digest "${expected_digest}" \
              --arg content_type "${content_type}" \
              --argjson size "${expected_size}" \
              '.state == "uploaded" and .digest == $digest and .content_type == $content_type and .size == $size' \
              <<< "${asset_json}" >/dev/null || {
                echo "Remote asset ${name} does not match the validated build" >&2
                exit 1
              }
          }

          release_json="$(
            node scripts/release/lookup-release.mjs \
              --repo "${GITHUB_REPOSITORY}" \
              --tag "${RELEASE_TAG}" \
              --allow-missing
          )"
          if [[ "${release_json}" != "null" ]]; then
            jq -e '.draft == true and .prerelease == false' <<< "${release_json}" >/dev/null || {
              echo "${RELEASE_TAG} exists but is not a normal draft release" >&2
              exit 1
            }

            while IFS= read -r asset_json; do
              validate_existing_asset "${asset_json}"
            done < <(jq -c '.assets[]' <<< "${release_json}")

            for name in qa-suite.skill qa-suite-source.zip; do
              if ! jq -e --arg name "${name}" '.assets[] | select(.name == $name)' <<< "${release_json}" >/dev/null; then
                gh release upload "${RELEASE_TAG}" "release-artifacts/${name}" \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done
          else
            gh release create "${RELEASE_TAG}" \
              "release-artifacts/qa-suite.skill#Claude.ai skill package" \
              "release-artifacts/qa-suite-source.zip#QA-Suite source package" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --fail-on-no-commits
          fi

  verify:
    name: Verify the draft release
    needs:
      - draft
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.commit }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download the validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.validate.outputs.commit }}
          path: release-artifacts

      - name: Verify API metadata and fresh downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          node scripts/release/verify-remote.mjs
          --repo "${GITHUB_REPOSITORY}"
          --tag "${RELEASE_TAG}"
          --ref HEAD
          --artifacts release-artifacts
          --evidence release-evidence.json
          --expected-state draft

      - name: Verify artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          set -euo pipefail
          signer="${GITHUB_REPOSITORY}/.github/workflows/draft-release.yml"
          gh attestation verify release-artifacts/qa-suite.skill \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer}" \
            --source-digest "${RELEASE_COMMIT}" \
            --source-ref "refs/heads/main" \
            --format json > attestation-qa-suite-skill.json
          gh attestation verify release-artifacts/qa-suite-source.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${signer}" \
            --source-digest "${RELEASE_COMMIT}" \
            --source-ref "refs/heads/main" \
            --format json > attestation-qa-suite-source.json

      - name: Retain release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ needs.validate.outputs.tag }}
          path: |
            release-artifacts/SHA256SUMS
            release-artifacts/build-evidence.json
            release-evidence.json
            attestation-qa-suite-skill.json
            attestation-qa-suite-source.json
          if-no-files-found: error
          retention-days: 90
