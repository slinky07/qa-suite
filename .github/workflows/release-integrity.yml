name: Release integrity

on:
  pull_request:
    paths:
      - "qa-suite/**"
      - "VERSION"
      - "README.md"
      - "AGENTS.md"
      - "WORKFLOW.md"
      - "docs/releasing.md"
      - ".codex-plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/evaluation/**"
      - "scripts/release/**"
      - "tests/**"
      - ".github/workflows/release-integrity.yml"
      - ".github/workflows/draft-release.yml"
      - ".github/workflows/publish-release.yml"
  push:
    branches:
      - main
    paths:
      - "qa-suite/**"
      - "VERSION"
      - "README.md"
      - "AGENTS.md"
      - "WORKFLOW.md"
      - "docs/releasing.md"
      - ".codex-plugin/plugin.json"
      - ".claude-plugin/plugin.json"
      - ".claude-plugin/marketplace.json"
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".agents/plugins/marketplace.json"
      - "scripts/evaluation/**"
      - "scripts/release/**"
      - "tests/**"
      - ".github/workflows/release-integrity.yml"
      - ".github/workflows/draft-release.yml"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deterministic release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run repository tests
        run: node --test

      - name: Build twice and verify release parity
        run: >-
          node scripts/release/check.mjs
          --ref "${GITHUB_SHA}"
          --output release-artifacts

      - name: Retain the verified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
